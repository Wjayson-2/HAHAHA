<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAHAHAHAHAHA</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .card {
            width: min(90%, 700px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .title-image {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        p {
            margin: 8px 0;
            color: #dbeafe;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 28px;
        }

        .unit {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 12px;
            border-radius: 18px;
        }

        .value {
            font-size: 2rem;
            font-weight: bold;
        }

        .label {
            margin-top: 8px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bfdbfe;
        }

        .target {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        @media (max-width: 640px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 1.7rem;
            }

            .title-image {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useEffect, useState } = React;

    function getNextMondayAt8AM() {
        const now = new Date();
        const target = new Date(now);
        const day = now.getDay();
        let daysUntilMonday = (8 - day) % 7;

        target.setHours(8, 0, 0, 0);

        if (day === 1 && now < target) {
            daysUntilMonday = 0;
        } else if (daysUntilMonday === 0) {
            daysUntilMonday = 7;
        }

        target.setDate(now.getDate() + daysUntilMonday);
        target.setHours(8, 0, 0, 0);

        return target;
    }

    function getTimeRemaining(targetDate) {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
            return { days: 0, hours: 0, minutes: 0, seconds: 0 };
        }

        return {
            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
            minutes: Math.floor((diff / (1000 * 60)) % 60),
            seconds: Math.floor((diff / 1000) % 60),
        };
    }

    function App() {
        const [targetDate, setTargetDate] = useState(getNextMondayAt8AM());
        const [timeLeft, setTimeLeft] = useState(getTimeRemaining(targetDate));

        useEffect(() => {
            const interval = setInterval(() => {
                const nextTarget = getNextMondayAt8AM();
                setTargetDate(nextTarget);
                setTimeLeft(getTimeRemaining(nextTarget));
            }, 1000);

            return () => clearInterval(interval);
        }, []);

        return (
            <div className="card">
                <div className="title-row">
                    <img
                        className="title-image"
                        src="./img.png"
                        alt="Countdown icon"
                    />
                    <h1>HAHAHAHAHAHA</h1>
                </div>

                <p>Live countdown based on your local time.</p>

                <div className="countdown">
                    <div className="unit">
                        <div className="value">{timeLeft.days}</div>
                        <div className="label">Days</div>
                    </div>
                    <div className="unit">
                        <div className="value">{timeLeft.hours}</div>
                        <div className="label">Hours</div>
                    </div>
                    <div className="unit">
                        <div className="value">{timeLeft.minutes}</div>
                        <div className="label">Minutes</div>
                    </div>
                    <div className="unit">
                        <div className="value">{timeLeft.seconds}</div>
                        <div className="label">Seconds</div>
                    </div>
                </div>

                <div className="target">
                    Target: {targetDate.toLocaleString()}
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
